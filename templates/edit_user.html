<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش - {{ panel_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="brand-logo-wrap">
                <img src="/static/logo.jpg" alt="CatWoman" class="panel-logo-img">
                <span class="logo">CatWoman</span>
            </div>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
        </div>
    </header>
    
    <div class="overlay" onclick="toggleMenu()"></div>
    <nav class="nav-menu">
        <a href="/dashboard" class="nav-item">📊 داشبورد</a>
        <a href="/users" class="nav-item active">👥 کاربران</a>
        <a href="/users/add" class="nav-item">➕ ساخت کاربر</a>
        <a href="/logout" class="nav-item">🚪 خروج</a>
    </nav>
    
    <div class="container">
        <h1 class="page-title">✏️ ویرایش {{ user.username }}</h1>
        
        <form method="POST" action="/users/edit/{{ user.id }}">
            <div class="form-section">
                <div class="form-section-title">📋 اطلاعات اصلی</div>
                
                <div class="form-group">
                    <label class="form-label">👤 نام کاربری</label>
                    <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">😺 ایموجی</label>
                    <input type="text" name="emoji" class="form-control" value="{{ user.emoji }}">
                </div>
                
                <div class="form-group">
                    <label class="form-label">📝 توضیحات</label>
                    <textarea name="description" class="form-control">{{ user.description }}</textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">⚡ وضعیت</label>
                    <select name="status" class="form-control">
                        <option value="active" {% if user.status == 'active' %}selected{% endif %}>فعال</option>
                        <option value="disabled" {% if user.status == 'disabled' %}selected{% endif %}>غیرفعال</option>
                    </select>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-section-title">⚙️ محدودیت‌ها</div>
                
                <div class="form-group">
                    <label class="form-label">💾 حجم (گیگابایت)</label>
                    <input type="number" name="data_limit" class="form-control" value="{{ data_limit_gb }}" min="0" step="0.1">
                </div>
                
                <div class="form-group">
                    <label class="form-label">⏰ مدت زمان (روز)</label>
                    <input type="number" name="expiry_days" class="form-control" value="{{ remaining_days }}" min="0">
                </div>
                
                <div class="form-group">
                    <label class="form-label">🌐 محدودیت IP</label>
                    <input type="number" name="ip_limit" class="form-control" value="{{ user.ip_limit }}" min="0">
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-section-title">🔗 تنظیمات پروتکل</div>
                
                <div class="form-group">
                    <label class="form-label">📡 پروتکل</label>
                    <select name="protocol" class="form-control">
                        <option value="vless" {% if user.protocol == 'vless' %}selected{% endif %}>VLESS</option>
                        <option value="vmess" {% if user.protocol == 'vmess' %}selected{% endif %}>VMess</option>
                        <option value="trojan" {% if user.protocol == 'trojan' %}selected{% endif %}>Trojan</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">🌊 Flow</label>
                    <select name="flow" class="form-control">
                        <option value="" {% if not user.flow %}selected{% endif %}>هیچکدام</option>
                        <option value="xtls-rprx-vision" {% if user.flow == 'xtls-rprx-vision' %}selected{% endif %}>XTLS Vision</option>
                    </select>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-section-title">📎 اطلاعات تکمیلی</div>
                
                <div class="form-group">
                    <label class="form-label">💬 آیدی تلگرام</label>
                    <input type="text" name="telegram_id" class="form-control" value="{{ user.telegram_id }}">
                </div>
                
                <div class="form-group">
                    <label class="form-label">📒 یادداشت</label>
                    <textarea name="note" class="form-control">{{ user.note }}</textarea>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">💾 ذخیره تغییرات</button>
            <a href="/users" class="btn btn-ghost btn-block" style="margin-top: 10px;">بازگشت</a>
        </form>
    </div>
    
    <script>
        function toggleMenu() {
            document.querySelector('.nav-menu').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }
    </script>
</body>
</html>

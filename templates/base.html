<!DOCTYPE html>
<html lang="fa" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ panel_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/logo.jpg" type="image/jpeg">
    
    <!-- فونت خفن از گوگل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Audiowide&display=swap" rel="stylesheet">
    
    <!-- استایل نئونی خفن برای اسم پنل و گربه متحرک -->
    <style>
        .brand-logo-wrap, .nav-brand {
            position: relative;
        }

        .logo, .nav-brand-text {
            font-family: 'Orbitron', 'Audiowide', sans-serif !important;
            font-weight: 900 !important;
            font-size: 20px !important;
            letter-spacing: 2px !important;
            text-transform: uppercase;
            color: #fff !important;
            background: none !important;
            -webkit-text-fill-color: #fff !important;
            display: inline-flex !important;
            align-items: center;
            gap: 10px;
            padding: 4px 12px;
            position: relative;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #ff00ff,
                0 0 20px #ff00ff,
                0 0 40px #bd00ff,
                0 0 80px #bd00ff;
            animation: neonFlicker 3s infinite alternate;
        }

        /* المان نئونی سمت چپ */
        .logo::before, .nav-brand-text::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 70%;
            background: linear-gradient(180deg, transparent, #ff00ff, #00ffff, transparent);
            box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            animation: neonPulse 1.5s infinite;
            border-radius: 2px;
        }

        /* المان نئونی سمت راست */
        .logo::after, .nav-brand-text::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 70%;
            background: linear-gradient(180deg, transparent, #00ffff, #ff00ff, transparent);
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            animation: neonPulse 1.5s infinite 0.5s;
            border-radius: 2px;
        }

        /* انیمیشن چشمک زدن نئون */
        @keyframes neonFlicker {
            0%, 100% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #ff00ff,
                    0 0 20px #ff00ff,
                    0 0 40px #bd00ff,
                    0 0 80px #bd00ff;
            }
            50% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #00ffff,
                    0 0 20px #00ffff,
                    0 0 40px #00bfff,
                    0 0 80px #00bfff;
            }
        }

        /* انیمیشن پالس نئونی */
        @keyframes neonPulse {
            0%, 100% { opacity: 1; transform: translateY(-50%) scaleY(1); }
            50% { opacity: 0.5; transform: translateY(-50%) scaleY(0.8); }
        }

        /* گربه متحرک */
        .cat-sticker {
            width: 32px;
            height: 32px;
            display: inline-block;
            vertical-align: middle;
            filter: drop-shadow(0 0 8px #ff00ff) drop-shadow(0 0 15px #bd00ff);
            animation: catDance 1.5s infinite ease-in-out;
        }

        @keyframes catDance {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            25% { transform: translateY(-4px) rotate(5deg); }
            50% { transform: translateY(0) rotate(-5deg); }
            75% { transform: translateY(-4px) rotate(5deg); }
        }

        /* برای فاصله اطراف نئون‌ها */
        .brand-logo-wrap {
            padding: 0 15px;
        }
    </style>
</head>
<body>
    {% if not hide_nav %}
    <header class="header">
        <div class="header-content">
            <div class="brand-logo-wrap">
                <img src="/static/logo.jpg" alt="Logo" class="panel-logo-img">
                <span class="logo">
                    <img src="https://media.tenor.com/x8v1oNUOmg4AAAAi/vibing-cat-cat-jamming.gif" 
                         onerror="this.onerror=null;this.src='https://cataas.com/cat/gif';" 
                         class="cat-sticker" alt="cat">
                    {{ panel_name }}
                </span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleLang()" title="Language">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                </button>
                <button class="icon-btn" onclick="toggleTheme()" title="Theme">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                </button>
                <button class="icon-btn" onclick="toggleMenu()" title="Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="overlay" onclick="toggleMenu()"></div>
    <nav class="nav-menu">
        <div class="nav-brand">
            <img src="/static/logo.jpg" alt="Logo">
            <div>
                <div class="nav-brand-text">
                    <img src="https://media.tenor.com/x8v1oNUOmg4AAAAi/vibing-cat-cat-jamming.gif" 
                         onerror="this.onerror=null;this.src='https://cataas.com/cat/gif';" 
                         class="cat-sticker" alt="cat">
                    {{ panel_name }}
                </div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;" data-i18n="panel_mgmt">مدیریت پنل</div>
            </div>
        </div>

        <a href="/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span data-i18n="dashboard">داشبورد</span>
        </a>
        <a href="/users" class="nav-item {% if active_page == 'users' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span data-i18n="users">کاربران</span>
        </a>
        <a href="/users/add" class="nav-item {% if active_page == 'add' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span data-i18n="add_user">ساخت کاربر</span>
        </a>
        <a href="/logout" class="nav-item" style="margin-top: auto;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span data-i18n="logout">خروج</span>
        </a>
    </nav>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
